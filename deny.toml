[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Zlib",
    "AGPL-3.0-or-later", # this crate's own license
]

[advisories]
# No safe upgrade is available for these; they are transitive deps pulled in
# by bio/rust-htslib, not anything we can address ourselves.
ignore = [
    "RUSTSEC-2025-0058", # custom_derive - unmaintained (via bio, rust-htslib)
    "RUSTSEC-2025-0057", # fxhash - unmaintained (via bio)
    "RUSTSEC-2024-0436", # paste - unmaintained (via bio -> statrs -> nalgebra -> simba)
    "RUSTSEC-2026-0173", # proc-macro-error2 - unmaintained (via bio -> getset)
]
