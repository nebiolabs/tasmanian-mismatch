name: CI # Continuous Integration

# Steps come from nebiolabs/rust-ci, pinned by SHA with its release tag in the comment.
# Dependabot bumps the pins together when rust-ci tags a new release.

on:
  push:
    branches:
      - master
    # Changes that cannot affect a build, test or benchmark (same list under pull_request).
    paths-ignore:
      - "**.md"
      - "benches/history/**"
      - "badges/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "benches/history/**"
      - "badges/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks, tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the coverage comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nebiolabs/rust-ci/setup@90543cebadcbcea8c3470f9e568450e23bdd4abb # v0.2.0
        with:
          cache: checks
          tools: grcov cargo-deny
          llvm-tools: true
      - uses: nebiolabs/rust-ci/checks@90543cebadcbcea8c3470f9e568450e23bdd4abb # v0.2.0

  benchmark:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the benchmark comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nebiolabs/rust-ci/setup@90543cebadcbcea8c3470f9e568450e23bdd4abb # v0.2.0
        with:
          cache: bench
          tools: hyperfine
      - uses: nebiolabs/rust-ci/bench@90543cebadcbcea8c3470f9e568450e23bdd4abb # v0.2.0

  publish:
    name: Commit badges and history
    runs-on: ubuntu-latest
    needs: [checks, benchmark]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nebiolabs/rust-ci/publish@90543cebadcbcea8c3470f9e568450e23bdd4abb # v0.2.0
