name: CI Metrics

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        # Version, profile and components all come from rust-toolchain.toml.
        run: |
          rustup show active-toolchain
          rustup component add llvm-tools

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/grcov
            target/
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('**/*.rs') }}

      - name: Install grcov (no-op if grcov is already installed from cache)
        run: command -v grcov || cargo install grcov --locked

      - name: Build instrumented binaries, run tests and generate coverage reports
        # The script sets RUSTFLAGS, LLVM_PROFILE_FILE and RUST_LOG itself and lets
        # `cargo test` build the binaries, so subprocess profiles match.
        run: bash scripts/code_coverage.sh

      - name: Display coverage summary
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          cat target/coverage/markdown.md >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.number }} --body "$(cat target/coverage/markdown.md)"

      - name: Upload HTML coverage report
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/coverage/html/

      - name: Add artifact link to summary
        run: |
          ARTIFACT_URL="${{ steps.upload-artifact.outputs.artifact-url }}"
          echo "**[Download HTML Coverage Report]($ARTIFACT_URL)**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact, extract it, and open \`index.html\` in your browser for the full interactive coverage report." >> $GITHUB_STEP_SUMMARY

      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: python3 scripts/gen-coverage-badge.py target/coverage/markdown.md badges/coverage.svg

      - name: Upload coverage badge artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-badge
          path: badges/coverage.svg

  update-repo:
    name: Commit coverage badge
    runs-on: ubuntu-latest
    needs: [coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download coverage badge
        uses: actions/download-artifact@v8
        with:
          name: coverage-badge
          path: badges

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.svg
          git diff --staged --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Update coverage badge [skip ci]"
          git push
