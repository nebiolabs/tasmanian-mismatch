name: Security audit

# Pull requests are covered by `cargo deny check` in CI (advisories included), so this is
# the nightly sweep plus a check whenever dependencies change on master.

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [master]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nebiolabs/rust-ci/setup@90543cebadcbcea8c3470f9e568450e23bdd4abb # v0.2.0
        with:
          cache: audit
          tools: cargo-audit
      - uses: nebiolabs/rust-ci/audit@90543cebadcbcea8c3470f9e568450e23bdd4abb # v0.2.0
