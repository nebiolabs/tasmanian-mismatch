[package]
name = "tasmanian-mismatch"
version = "2.0.5"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
noodles = { version = "<0.200", features = ["bam", "sam", "core", "bgzf", "csi", "fasta"] }
noodles-bgzf = { version = "<1.0", features = ["libdeflate"] }
rayon = "1.12"
clap = { version = "4.6.1", features = ["derive"] }
fastrand = "2.5"

log = "0.4"
env_logger = "0.11"

[[bin]]
name = "tasmanian-rescale-quality"
path = "src/tasmanian-rescale-quality.rs"

[[bin]]
name = "tasmanian-mismatch"
path = "src/tasmanian-mismatch.rs"

[[bin]]
name = "tasmanian-diagnostics"
path = "src/tasmanian-diagnostics.rs"
